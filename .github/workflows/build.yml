name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build nightcore-spigot dependency
        run: |
          git clone --depth 1 --branch v2.10.0 https://github.com/nulli0n/nightcore-spigot.git /tmp/nightcore-spigot
          cd /tmp/nightcore-spigot
          mvn -B install -DskipTests --no-transfer-progress

      - name: Build with Maven
        run: mvn -B package --no-transfer-progress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentCrates-${{ github.sha }}
          path: target/ExcellentCrates-*.jar
          if-no-files-found: error
